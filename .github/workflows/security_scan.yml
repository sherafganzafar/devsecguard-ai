name: DevSecGuard AI Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openai python-dotenv

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Exits with code 1 (failing the job and blocking the merge) when a finding
      # at or above the threshold exists. Without NEBIUS_API_KEY (for example on
      # pull requests from forks) the scan still runs with the regex layer.
      # tests/ is excluded because it holds intentionally fake secrets for the unit tests.
      - name: Run DevSecGuard AI scan
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python agent.py --repo . --exclude tests --fail-on high --json-out devsecguard-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecguard-report
          path: devsecguard-report.json
          if-no-files-found: ignore
